<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Connection | Log In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Aurora Background Blobs -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="aurora-blob blob-4"></div>
  </div>

  <div class="auth-container glass-panel">
    <div class="auth-header">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to your spatial chat pipeline</p>
    </div>

    <form id="login-form">
      <div class="glass-input-wrapper">
        <label class="glass-label" for="login-userid">User ID</label>
        <input type="text" id="login-userid" class="glass-input" placeholder="e.g. AG10283" required autocomplete="username">
      </div>

      <div class="glass-input-wrapper">
        <label class="glass-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="glass-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="login-error" style="color: #ff3b30; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 500; min-height: 18px;"></div>

      <button type="submit" class="btn-primary">
        <span>Log In</span>
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a href="signup.html" class="auth-link">Create Account</a>
    </div>
  </div>

  <!-- CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="features.js"></script>
</body>
</html>
