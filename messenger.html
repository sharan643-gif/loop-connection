<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Connection | Chats</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Aurora Background Blobs -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="aurora-blob blob-4"></div>
  </div>

  <!-- Main Application Wrapper -->
  <main class="app-container glass-panel" id="main-app-card">

    <!-- Dims the app and closes the Contacts drawer when tapped (mobile/tablet only) -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- COLUMN 1: SIDEBAR (Social Desk) -->
    <section class="sidebar-col">
      <div class="sidebar-header" style="display:flex; align-items:center; justify-content:space-between;">
        <h2 class="sidebar-title">Contacts</h2>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="chat-action-btn" id="create-group-btn" title="New Group" aria-label="Create group chat">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </div>
          <div class="chat-action-btn sidebar-close-btn" id="sidebar-close-btn" title="Close" aria-label="Close contacts">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </div>
        </div>
      </div>

      <!-- Add Friend search input -->
      <div class="search-box-container">
        <div class="glass-search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" class="glass-search-input" id="friend-search-input" placeholder="Search User ID or Name..." autocomplete="off">
        </div>
      </div>

      <!-- Search results float overlay -->
      <div class="search-results-pane" id="search-results-panel" style="display: none;">
        <!-- Filled dynamically -->
      </div>

      <div class="sidebar-scroll">
        <!-- Pending Friend Requests Widget -->
        <span class="section-label">Pending Requests</span>
        <div class="pending-requests-list" id="pending-requests-container" style="margin-bottom: 24px;">
          <!-- Filled dynamically -->
        </div>

        <!-- Friend List -->
        <span class="section-label">Friends List</span>
        <div id="friends-list-container" style="margin-bottom: 24px;">
          <!-- Filled dynamically -->
        </div>

        <!-- Group Chats Widget -->
        <span class="section-label">Groups</span>
        <div id="groups-list-container">
          <!-- Filled dynamically -->
        </div>
      </div>
    </section>

    <!-- COLUMN 2: CONVERSATION LIST (Threads Desk) -->
    <section class="chats-col">
      <div class="chats-header">
        <div class="chats-title-row">
          <div class="chat-action-btn mobile-contacts-btn" id="open-contacts-btn" title="Contacts" aria-label="Open contacts">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <h2 class="chats-title">Loop Connection</h2>
        </div>
      </div>

      <div class="chats-list-scroll" id="conversations-list-container">
        <!-- Filled dynamically -->
      </div>
    </section>

    <!-- COLUMN 3: MAIN CHAT BOX (Viewport Desk) -->
    <section class="chat-main-col" id="chat-main-column">
      <!-- Empty state displayed default before selecting user -->
      <div class="chat-empty-state">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
        </div>
        <div>
          <h3 class="empty-state-title">Your Spatial Messages</h3>
          <p style="font-size: 13px; margin-top: 6px; opacity: 0.65;">Select a chat thread or select a contact in sidebar to begin.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="features.js"></script>
</body>
</html>
