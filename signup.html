<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMessage 27 | Create Account</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Compact layout adjustments for larger forms */
    .auth-container.signup-wide {
      width: 520px;
      padding: 30px 40px;
    }
    .signup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }
    .grid-span-2 {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <!-- Aurora Background Blobs -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="aurora-blob blob-4"></div>
  </div>

  <div class="auth-container glass-panel signup-wide">
    <div class="auth-header" style="margin-bottom: 20px;">
      <h1 class="auth-title" style="font-size: 24px;">Create Account</h1>
      <p class="auth-subtitle">Join the next generation of messaging</p>
    </div>

    <form id="signup-form">
      <div class="signup-grid">
        <div class="glass-input-wrapper grid-span-2" style="margin-bottom: 10px;">
          <label class="glass-label" for="signup-fullname">Full Name</label>
          <input type="text" id="signup-fullname" class="glass-input" placeholder="Alexander Vance" required>
        </div>

        <div class="glass-input-wrapper" style="margin-bottom: 10px;">
          <label class="glass-label" for="signup-username">Username</label>
          <input type="text" id="signup-username" class="glass-input" placeholder="alexv" required>
        </div>

        <div class="glass-input-wrapper" style="margin-bottom: 10px;">
          <label class="glass-label" for="signup-userid">Choose User ID</label>
          <input type="text" id="signup-userid" class="glass-input" style="font-weight: 700; text-align: center; text-transform: uppercase;" placeholder="e.g. AG10283" maxlength="20" required autocomplete="off" title="Pick your own unique user identifier">
          <span id="userid-availability-msg" style="display:block; font-size: 11px; margin-top: 5px; font-weight: 500; min-height: 14px;"></span>
        </div>

        <div class="glass-input-wrapper grid-span-2" style="margin-bottom: 10px;">
          <label class="glass-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="glass-input" placeholder="alex@icloud.com" required autocomplete="email">
        </div>

        <div class="glass-input-wrapper" style="margin-bottom: 12px;">
          <label class="glass-label" for="signup-password">Password</label>
          <input type="password" id="signup-password" class="glass-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="glass-input-wrapper" style="margin-bottom: 12px;">
          <label class="glass-label" for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" class="glass-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
      </div>

      <div id="signup-error" style="color: #ff3b30; font-size: 13px; text-align: center; margin-bottom: 15px; font-weight: 500; min-height: 18px;"></div>

      <button type="submit" class="btn-primary">
        <span>Create Account</span>
        <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 15px;">
      <span>Already have an account?</span>
      <a href="login.html" class="auth-link">Log In</a>
    </div>
  </div>

  <!-- CDN scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="features.js"></script>
</body>
</html>
